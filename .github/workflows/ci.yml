name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you run the workflow by hand from the Actions tab on any branch. Without
  # it, pushing a feature branch runs nothing at all (the push trigger is
  # main-only and there is no PR yet), which reads as "CI is broken" on a freshly
  # pushed repo rather than "CI has nothing to do".
  workflow_dispatch::

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: Build & test (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++-14
          -DPULSEDB_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  dashboard:
    name: Build dashboard (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Type-check and build
        run: npm run build
        working-directory: dashboard
